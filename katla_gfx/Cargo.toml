[package]
name = "katla_gfx"
version = "0.1.0"
authors = ["Mik-pe <mikael.pettersson201@gmail.com>"]
edition = "2024"
autoexamples = false

[features]
default = []
validation = []

[dependencies]
raw-window-handle = { workspace = true }
ash = { workspace = true }
ash-window = { workspace = true }
gpu-allocator = { workspace = true }
naga = { workspace = true }
bytemuck = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
bitflags = { workspace = true }
smallvec = "1"
sha2 = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.5"
objc2 = { version = "0.6", features = ["exception"] }
objc2-metal = { version = "0.3", default-features = false, features = [
    "std", "block2", "objc2-core-foundation", "MTLTypes", "MTL4BufferRange",
    "MTLRenderCommandEncoder", "MTL4Counters",
    "MTLDevice",
    "MTLCommandEncoder",
    "MTLTexture", "MTLBuffer", "MTLSampler", "MTLPipeline",
    "MTLEvent", "MTLHeap",
    "MTLDrawable",
    "MTLRenderPipeline", "MTLComputePipeline", "MTLDepthStencil",
    "MTLVertexDescriptor", "MTLRenderPass",
    "MTLLibrary", "MTLFunctionDescriptor", "MTLFunctionConstantValues",
    "MTLAllocation", "MTLResource", "MTLPixelFormat", "MTLArgument",
    "MTLDataType",
    "MTL4CommandAllocator", "MTL4CommandBuffer", "MTL4CommandQueue",
    "MTL4CommandEncoder", "MTL4RenderCommandEncoder", "MTL4ComputeCommandEncoder",
    "MTL4RenderPass", "MTL4ArgumentTable", "MTL4CommitFeedback",
    "MTLResidencySet", "MTL4Compiler", "MTL4CompilerTask", "MTL4Archive",
    "MTL4PipelineDataSetSerializer", "MTL4PipelineState", "MTL4LibraryDescriptor",
    "MTL4LibraryFunctionDescriptor", "MTL4FunctionDescriptor",
    "MTL4RenderPipeline", "MTL4ComputePipeline",
] }
objc2-quartz-core = { version = "0.3", features = ["CAMetalLayer"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSDictionary", "NSRange", "NSGeometry", "NSError"] }
block2 = { version = "0.6" }

[dev-dependencies]
env_logger = { workspace = true }
criterion = "0.5"

[[bench]]
name = "command_buffer_recording"
harness = false

[[bench]]
name = "frame_preparation"
harness = false

[[bench]]
name = "mesh_upload"
harness = false
