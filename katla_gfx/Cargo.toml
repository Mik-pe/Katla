[package]
name = "katla_gfx"
version = "0.1.0"
authors = ["Mik-pe <mikael.pettersson201@gmail.com>"]
edition = "2024"
autoexamples = false

[features]
default = []
validation = []

[dependencies]
raw-window-handle = { workspace = true }
ash = { workspace = true }
ash-window = { workspace = true }
gpu-allocator = { workspace = true }
naga = { workspace = true }
bytemuck = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
bitflags = { workspace = true }
smallvec = "1"
itertools = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
objc2-metal = { version = "0.3", features = [
    "MTLDevice", "MTLCommandQueue", "MTLCommandBuffer",
    "MTLCommandEncoder", "MTLRenderCommandEncoder", "MTLComputeCommandEncoder", "MTLBlitCommandEncoder",
    "MTLTexture", "MTLBuffer", "MTLSampler", "MTLPipeline",
    "MTLArgumentEncoder", "MTLFence", "MTLEvent", "MTLHeap",
    "MTLBinaryArchive", "MTLDrawable",
    "MTLRenderPipeline", "MTLComputePipeline", "MTLDepthStencil",
    "MTLVertexDescriptor", "MTLRenderPass", "MTLComputePass", "MTLBlitPass",
    "MTLLibrary", "MTLFunctionDescriptor", "MTLFunctionConstantValues",
    "MTLAllocation", "MTLResource", "MTLPixelFormat", "MTLArgument",
    "MTLDataType", "MTLCounters",
] }
objc2-quartz-core = { version = "0.3", features = ["CAMetalLayer"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSDictionary", "NSRange", "NSGeometry", "NSError"] }
block2 = { version = "0.6" }

[dev-dependencies]
env_logger = { workspace = true }
criterion = "0.5"

[[bench]]
name = "command_buffer_recording"
harness = false

[[example]]
name = "particle_validation"
required-features = ["validation"]

[[example]]
name = "animation_validation"
required-features = ["validation"]

[[example]]
name = "light_shadow_validation"
required-features = ["validation"]

[[example]]
name = "picking_validation"
required-features = ["validation"]

[[example]]
name = "outline_validation"
required-features = ["validation"]
