name: Agent fix Metal Objective-C exception

# Validation revision: explicit unsupported-device exit status.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Apply candidate Metal compatibility patch
        run: python3 .github/scripts/apply_metal_argument_encoder_fix.py

      - name: Format source
        run: cargo fmt --all

      - name: Test renderer construction and draw upload
        shell: bash
        env:
          RUST_BACKTRACE: full
          RUST_LOG: info
        run: |
          set -o pipefail
          cargo test -p katla_gfx \
            metal::metal_renderer::tests::test_metal_execute_draw_calls \
            --lib -- --exact --nocapture --test-threads=1 \
            2>&1 | tee /tmp/metal-execute-draw-calls.log

      - name: Test headless rendering or explicit unsupported skip
        shell: bash
        env:
          RUST_BACKTRACE: full
          RUST_LOG: info
        run: |
          set -o pipefail
          cargo test -p katla_gfx \
            metal::metal_renderer::tests::test_headless_render_not_white \
            --lib -- --exact --nocapture --test-threads=1 \
            2>&1 | tee /tmp/metal-headless-render.log

      - name: Verify complete headless editor never crosses a foreign exception
        shell: bash
        env:
          RUST_BACKTRACE: full
          RUST_LOG: info
        run: |
          set +e
          cargo run -p game --bin katla -- \
            --headless -s --screenshot /tmp/katla-editor.png \
            2>&1 | tee /tmp/katla-editor.log
          status=${PIPESTATUS[0]}
          set -e

          if grep -q "fatal runtime error: Rust cannot catch foreign exceptions" /tmp/katla-editor.log; then
            echo "A foreign Objective-C exception still crossed into Rust"
            exit 1
          fi

          if test -s /tmp/katla-editor.png; then
            file /tmp/katla-editor.png
            exit 0
          fi

          test "$status" -ne 0
          grep -q "Unsupported GPU feature" /tmp/katla-editor.log
          grep -qi "Apple Paravirtual device" /tmp/katla-editor.log
          echo "SKIP headless editor rendering: virtual Metal device lacks the bindless shader ABI"

      - name: Run the graphics library suite serially
        shell: bash
        env:
          RUST_BACKTRACE: full
        run: |
          set -o pipefail
          cargo test -p katla_gfx --lib -- --test-threads=1 \
            2>&1 | tee /tmp/katla-gfx-serial.log

      - name: Run the graphics library suite with default concurrency
        shell: bash
        env:
          RUST_BACKTRACE: full
        run: |
          set -o pipefail
          cargo test -p katla_gfx --lib \
            2>&1 | tee /tmp/katla-gfx-default.log

      - name: Check graphics and application crates
        run: cargo check -p katla_gfx -p katla_app

      - name: Lint graphics and application crates
        run: cargo clippy -p katla_gfx -p katla_app -- -D warnings

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-objective-c-exception-fix-validation
          path: |
            /tmp/metal-execute-draw-calls.log
            /tmp/metal-headless-render.log
            /tmp/katla-editor.log
            /tmp/katla-editor.png
            /tmp/katla-gfx-serial.log
            /tmp/katla-gfx-default.log
          if-no-files-found: warn
          retention-days: 1

      - name: Commit validated production source
        shell: bash
        run: |
          git add \
            Cargo.lock \
            game/src/main.rs \
            katla_gfx/Cargo.toml \
            katla_gfx/src/error.rs \
            katla_gfx/src/metal/argument_buffer.rs \
            katla_gfx/src/metal/material_api.rs \
            katla_gfx/src/metal/metal_renderer.rs
          if git diff --cached --quiet; then
            echo "Validated production source is already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix Metal argument-buffer initialization on virtual devices"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
