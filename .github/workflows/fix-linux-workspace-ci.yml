name: Fix Linux workspace portability

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/modern-macos-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Install Linux graphics and audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            vulkan-tools
          vulkaninfo --summary

      - name: Apply portability fixes
        run: python3 .github/scripts/fix_linux_workspace_ci.py

      - name: Format workspace
        run: cargo fmt --all

      - name: Check workspace
        shell: bash
        run: |
          set +e
          cargo check --workspace --locked --quiet > /tmp/portability-check.log 2>&1
          status=$?
          cat /tmp/portability-check.log
          exit "$status"

      - name: Upload check diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-portability-check
          path: /tmp/portability-check.log
          retention-days: 1

      - name: Test workspace
        shell: bash
        run: |
          set +e
          cargo test --workspace --locked --quiet > /tmp/portability-test.log 2>&1
          status=$?
          cat /tmp/portability-test.log
          exit "$status"

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-portability-test
          path: /tmp/portability-test.log
          retention-days: 1

      - name: Lint workspace
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --locked --quiet -- -D warnings \
            > /tmp/portability-clippy.log 2>&1
          status=$?
          cat /tmp/portability-clippy.log
          exit "$status"

      - name: Upload Clippy diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-portability-clippy
          path: /tmp/portability-clippy.log
          retention-days: 1

      - name: Commit validated fixes
        run: |
          git add \
            game/src/main.rs \
            katla_app/src/application/builder.rs \
            katla_app/src/application/editor/mod.rs \
            katla_app/src/application/frame_loop.rs \
            katla_app/src/application/gizmo.rs \
            katla_app/src/application/headless.rs \
            katla_app/src/application/mod.rs \
            katla_app/src/application/picking.rs \
            katla_app/src/application/renderer.rs \
            katla_app/src/application/ui_test.rs \
            katla_app/src/ui/editor_ui/mod.rs \
            katla_app/src/ui/mod.rs \
            katla_gfx/src/vulkan/bindless_texture.rs \
            katla_gfx/tests/particle_preset_tests.rs \
            katla_ui/src/text/mod.rs
          if git diff --cached --quiet; then
            echo "Portability fixes are already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore Linux workspace portability"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
