name: Agent benchmark validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Check changed-file formatting
        run: rustfmt --edition 2024 --check katla_gfx/benches/command_buffer_recording.rs

      - name: Compile benchmark target
        run: cargo test -p katla_gfx --bench command_buffer_recording --no-run

      - name: Lint benchmark target
        id: clippy
        continue-on-error: true
        run: cargo clippy -p katla_gfx --bench command_buffer_recording -- -D warnings 2>&1 | tee /tmp/benchmark-clippy.log

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-clippy-log
          path: /tmp/benchmark-clippy.log
          retention-days: 1

      - name: Require successful lint
        if: always()
        run: test "${{ steps.clippy.outcome }}" = success
