name: Materialize application-owned frame graphs

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: application-frame-graph-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize-product-commit:
    if: github.head_ref == 'agent/application-owned-frame-graphs'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v6
        with:
          ref: agent/application-owned-frame-graphs
          fetch-depth: 0

      - name: Materialize reviewed patches
        run: |
          python3 - <<'PY'
          import base64
          import glob
          import hashlib
          import zlib

          def materialize(pattern: str, destination: str, expected_sha256: str | None = None) -> None:
              chunks = sorted(glob.glob(pattern))
              if not chunks:
                  raise RuntimeError(f'No patch chunks matched {pattern}')
              encoded = ''.join(
                  open(path, encoding='utf-8').read().strip()
                  for path in chunks
              )
              decoded = zlib.decompress(base64.b64decode(encoded, validate=True))
              digest = hashlib.sha256(decoded).hexdigest()
              if expected_sha256 is not None and digest != expected_sha256:
                  raise RuntimeError(
                      f'{pattern} digest mismatch: expected {expected_sha256}, got {digest}'
                  )
              with open(destination, 'wb') as patch_file:
                  patch_file.write(decoded)

          materialize('.agent/application-owned-patch/*', '/tmp/application-owned.patch')
          materialize(
              '.agent/application-owned-fix/*',
              '/tmp/application-owned-fix.patch',
              'd46191f6f23cf327f4576be8301f03602a08b46000da6aa78a958b4235ae1f89',
          )
          PY
          git apply --index /tmp/application-owned.patch
          git apply --index /tmp/application-owned-fix.patch

      - name: Format Rust workspace
        run: cargo fmt --all

      - name: Publish clean product commit
        run: |
          rm -rf .agent
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git add -A
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git commit -m "Make application frame graphs configurable"
          git push origin HEAD:agent/application-owned-frame-graphs
