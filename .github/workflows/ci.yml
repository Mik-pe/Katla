name: Materialize render-graph pass culling

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: render-graph-culling-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  materialize-and-validate:
    if: github.head_ref == 'agent/render-graph-pass-culling'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v6
        with:
          ref: agent/render-graph-pass-culling
          fetch-depth: 0

      - name: Materialize reviewed product patches
        run: |
          python3 - <<'PY'
          import base64
          import glob
          import subprocess
          import zlib

          def apply(encoded: str) -> None:
              patch = zlib.decompress(base64.b64decode(encoded))
              subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)

          apply(''.join(
              open(path, encoding='utf-8').read()
              for path in sorted(glob.glob('.agent/render-graph-culling-patch/*'))
          ))
          for path in sorted(glob.glob('.agent/render-graph-culling-fixes/*')):
              apply(open(path, encoding='utf-8').read())
          PY

      - name: Install stable Rust and Linux graphics dependencies
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            vulkan-validationlayers

      - name: Format workspace
        run: cargo fmt --all

      - name: Check graphics library
        run: cargo check -p katla_gfx --lib --locked

      - name: Test graphics library
        run: cargo test -p katla_gfx --lib --locked

      - name: Check application
        run: cargo check -p katla_app --locked

      - name: Test application library
        run: cargo test -p katla_app --lib --locked

      - name: Lint graphics library
        run: cargo clippy -p katla_gfx --lib --locked -- -D warnings

      - name: Lint application changes
        run: >-
          cargo clippy -p katla_app --locked --
          -D warnings
          -A dead-code
          -A unfulfilled-lint-expectations

      - name: Restore canonical CI and publish product commit
        run: |
          rm -rf .agent
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git add -A
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git commit -m "Cull unobservable render-graph passes"
          git push origin HEAD:agent/render-graph-pass-culling
