name: Export post-culling source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-source:
    if: github.head_ref == 'agent/source-export-after-culling'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Pack source snapshot
        run: tar --exclude=.git --exclude=target -czf /tmp/katla-source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: katla-after-culling-source
          path: /tmp/katla-source.tar.gz
          if-no-files-found: error
          retention-days: 1
