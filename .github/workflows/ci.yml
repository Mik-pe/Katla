name: Apply application-owned frame-graph patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-agent-patch:
    if: github.head_ref == 'agent/application-owned-frame-graphs'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v6
        with:
          ref: agent/application-owned-frame-graphs
          fetch-depth: 0

      - name: Materialize reviewed patch
        run: |
          python3 - <<'PY'
          import base64
          import glob
          import zlib

          encoded = ''.join(
              open(path, encoding='utf-8').read()
              for path in sorted(glob.glob('.agent/application-owned-patch/*'))
          )
          with open('/tmp/agent.patch', 'wb') as patch_file:
              patch_file.write(zlib.decompress(base64.b64decode(encoded)))
          PY
          git apply --index /tmp/agent.patch

      - name: Format Rust workspace
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          cargo fmt --all

      - name: Validate application on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            vulkan-validationlayers
          cargo check -p katla_app --locked --quiet
          cargo test -p katla_app --lib --locked --quiet
          cargo clippy -p katla_app --locked --quiet -- -D warnings

      - name: Restore canonical CI and publish product commit
        run: |
          rm -rf .agent
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git add -A
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git commit -m "Make application frame graphs configurable"
          git push origin HEAD:agent/application-owned-frame-graphs
