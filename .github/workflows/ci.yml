name: Publish Metal plan cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish-cleanup:
    if: github.head_ref == 'agent/publish-metal-plan-clippy-fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out clean product branch
        uses: actions/checkout@v6
        with:
          ref: agent/metal-compiled-pass-stream-clean
          fetch-depth: 0

      - name: Remove obsolete singleton-schedule queues
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('katla_gfx/src/metal/metal_renderer.rs')
          source = path.read_text()
          obsolete = [
              '    pub(crate) pending_depth_prepass_draw_list: Option<DrawList>,\n',
              '    pub(crate) pending_shadow_draw_list: Option<DrawList>,\n',
              '    pub(crate) pending_outline_draw_list: Option<DrawList>,\n',
              '            pending_depth_prepass_draw_list: None,\n',
              '            pending_shadow_draw_list: None,\n',
              '            pending_outline_draw_list: None,\n',
          ]
          for line in obsolete:
              if line not in source:
                  raise SystemExit(f'missing expected obsolete line: {line!r}')
              source = source.replace(line, '', 1)
          path.write_text(source)
          PY
          git diff --check

      - name: Publish cleanup commit
        run: |
          git add katla_gfx/src/metal/metal_renderer.rs
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git commit -m "Remove obsolete Metal schedule queues"
          git push origin HEAD:agent/metal-compiled-pass-stream-clean
