name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  linux-quality:
    name: Linux quality
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Install Linux development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  macos:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 26 / Metal primary
            os: macos-26
            lint: true
          - name: macOS 15 / compatibility
            os: macos-15
            lint: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Report runner environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          system_profiler SPDisplaysDataType || true

      - name: Check graphics and application crates
        run: cargo check -p katla_gfx -p katla_app --locked

      - name: Test graphics library
        run: cargo test -p katla_gfx --lib --locked

      - name: Lint graphics and application crates
        if: matrix.lint
        run: cargo clippy -p katla_gfx -p katla_app --locked -- -D warnings
