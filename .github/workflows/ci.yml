name: Publish compiled resource lifetimes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish-product-commit:
    if: github.head_ref == 'agent/compiled-resource-lifetimes'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v6
        with:
          ref: agent/compiled-resource-lifetimes
          fetch-depth: 0

      - name: Materialize reviewed patch
        run: |
          python3 - <<'PY'
          import base64
          import glob
          import subprocess
          import zlib

          encoded = ''.join(
              open(path, encoding='utf-8').read()
              for path in sorted(glob.glob('.agent/resource-lifetimes/*'))
          )
          patch = zlib.decompress(base64.b64decode(encoded))
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY

      - name: Replace staging commits with product commit
        run: |
          rm -rf .agent
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git add -A
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git commit -m "Compile live resource lifetime intervals"
          git push origin HEAD:agent/compiled-resource-lifetimes
