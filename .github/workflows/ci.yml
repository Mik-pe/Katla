name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  linux-graphics:
    name: Linux graphics quality
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Install Linux graphics dependencies
        run: |
          # The runner's preinstalled google-chrome apt source intermittently
          # serves hash-mismatched metadata that fails apt-get update; the
          # jobs never use Chrome, so drop the source before updating.
          # Ubuntu 24.04 images carry it as either .list or deb822 .sources.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            vulkan-tools \
            vulkan-validationlayers
          vulkaninfo --summary

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check and test ECS
        run: |
          cargo check -p katla_ecs --all-targets --all-features --locked
          cargo test -p katla_ecs --all-features --locked
          cargo clippy -p katla_ecs --all-targets --all-features --locked -- -D warnings

      - name: Check graphics library
        run: cargo check -p katla_gfx --all-targets --locked --quiet

      - name: Test graphics library
        run: cargo test -p katla_gfx --lib --locked --quiet -- --test-threads=1

      - name: Test agent-driven animation fades on Vulkan
        run: |
          cargo test -p katla_app -p katla_agent --lib --all-features --locked animation
          cargo test -p katla_app --lib native_transition_tests --all-features --locked -- --ignored --test-threads=1
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_INCREMENTAL: "0"

      - name: Test deterministic trigger rules and Luau event delivery
        run: |
          cargo test -p katla_app -p katla_agent --lib --all-features --locked events
          cargo test -p katla_app --lib events::tests::test_native_scene_trigger_reference_roundtrip --all-features --locked -- --ignored --test-threads=1
          cargo test -p katla_physics -p katla_script --locked
          cargo clippy -p katla_physics -p katla_script --all-targets --all-features --locked -- -D warnings
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_INCREMENTAL: "0"

      - name: Lint graphics library
        run: cargo clippy -p katla_gfx --all-targets --locked --quiet -- -D warnings

      - name: Cross-backend contract suite (Vulkan on lavapipe)
        # Serial: lavapipe's pipe-loader races on concurrent instance
        # creation inside one process. The PBR pipeline scenarios are
        # skipped: lavapipe segfaults inside that driver path (the same
        # tests pass on real Intel Vulkan and run in the macOS Metal job).
        run: cargo test -p katla_gfx --test contract --locked -- --ignored --test-threads=1 --skip graphics::pbr

      - name: Vulkan transient allocation, aliasing and resize validation
        run: cargo test -p katla_gfx --test transient_aliasing --locked -- --ignored --test-threads=1

      - name: Vulkan native capture and retained readback validation
        run: cargo test -p katla_gfx --lib renderer::capture_tests --locked -- --ignored --test-threads=1

      - name: Vulkan graphics binding allocation and retirement validation
        run: |
          cargo test -p katla_gfx --lib descriptor_ --locked -- --ignored --test-threads=1
          cargo test -p katla_gfx --lib vulkan::frame_resources --locked -- --ignored --test-threads=1
          cargo test -p katla_gfx --test graphics_phase_allocations --locked -- --ignored --test-threads=1

      - name: Upload render-graph diagnostics artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-graph-plan-execution-linux
          path: target/render-graph-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

  macos-26:
    name: macOS 26 / Metal
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Report runner environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          system_profiler SPDisplaysDataType || true

      - name: Check and test ECS and migrated systems
        run: |
          cargo check -p katla_ecs --all-targets --all-features --locked
          cargo test -p katla_ecs --all-features --locked
          cargo test -p katla_app -p katla_agent --lib --all-features --locked
          cargo test -p katla_physics -p katla_script --locked
          cargo clippy -p katla_ecs -p katla_physics -p katla_script --all-targets --all-features --locked -- -D warnings

      - name: Check graphics and application crates
        run: |
          cargo check -p katla_gfx -p katla_app --all-targets --locked --quiet
          cargo check -p katla_app --no-default-features --all-targets --locked --quiet

      - name: Probe default GPU Metal 4 support
        id: metal4
        run: |
          metal4_supported="$(xcrun swift -e 'import Metal; print(MTLCreateSystemDefaultDevice()?.supportsFamily(.metal4) == true ? "true" : "false")')"
          echo "supported=$metal4_supported" >> "$GITHUB_OUTPUT"
          if [ "$metal4_supported" != "true" ]; then
            echo "::notice::Native Metal 4 acceptance BLOCKED: the hosted virtual GPU lacks Metal 4. Portable tests and typed capability rejection still run."
            echo "Native Metal 4 acceptance: **BLOCKED** — default GPU lacks Metal 4. This job validates the current SDK, portable graphics tests and typed rejection; physical GPU acceptance is recorded separately." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify agent-driven animation fades on native Metal
        if: steps.metal4.outputs.supported == 'true'
        run: cargo test -p katla_app --lib native_transition_tests --all-features --locked -- --ignored --test-threads=1
        env:
          MTL_DEBUG_LAYER: "1"
          METAL_DEVICE_WRAPPER_TYPE: "1"

      - name: Verify trigger rule persistence in a native application
        if: steps.metal4.outputs.supported == 'true'
        run: cargo test -p katla_app --lib events::tests::test_native_scene_trigger_reference_roundtrip --all-features --locked -- --ignored --test-threads=1
        env:
          MTL_DEBUG_LAYER: "1"
          METAL_DEVICE_WRAPPER_TYPE: "1"

      - name: Verify Metal 4 capability rejection precedes native creation
        run: cargo test -p katla_gfx --lib --locked --quiet metal::context::tests::test_metal_context_capability_precedes_native_creation -- --exact
        env:
          MTL_DEBUG_LAYER: "1"
          METAL_DEVICE_WRAPPER_TYPE: "1"

      - name: Test graphics library according to actual GPU capability
        run: |
          if [ "${{ steps.metal4.outputs.supported }}" = "true" ]; then
            cargo test -p katla_gfx --lib --locked --quiet -- --test-threads=1
          else
            metal4_test_filters=()
            while IFS= read -r filter; do
              case "$filter" in ""|\#*) continue ;; esac
              metal4_test_filters+=(--skip "$filter")
            done < katla_gfx/tests/metal4-required-tests.txt
            cargo test -p katla_gfx --lib --locked --quiet -- --test-threads=1 "${metal4_test_filters[@]}"
          fi
        env:
          MTL_DEBUG_LAYER: "1"
          METAL_DEVICE_WRAPPER_TYPE: "1"

      - name: Lint graphics and application crates
        run: cargo clippy -p katla_gfx -p katla_app -p katla_agent --all-targets --all-features --locked --quiet -- -D warnings

      - name: Cross-backend contract suite (Metal with API validation)
        if: steps.metal4.outputs.supported == 'true'
        run: cargo test -p katla_gfx --test contract --locked -- --ignored
        env:
          MTL_DEBUG_LAYER: "1"
          METAL_DEVICE_WRAPPER_TYPE: "1"

      - name: Upload render-graph diagnostics artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-graph-plan-execution-macos
          path: target/render-graph-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

  ecs-miri:
    name: ECS pointer and lifetime checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pinned nightly with Miri
        run: rustup toolchain install nightly-2026-08-04 --profile minimal --component miri

      - name: Check query ownership
        run: |
          cargo +nightly-2026-08-04 miri test -p katla_ecs --lib typed_query::tests --locked
          cargo +nightly-2026-08-04 miri test -p katla_ecs --lib params::tests::test_param --locked
          cargo +nightly-2026-08-04 miri test -p katla_ecs --lib query::filter::tests --locked
          cargo +nightly-2026-08-04 miri test -p katla_ecs --lib entity_allocator::tests --locked
          cargo +nightly-2026-08-04 miri test -p katla_ecs --lib sparse_set::tests::test_generational_keys_reject_stale_access --locked
          cargo +nightly-2026-08-04 miri test -p katla_ecs --lib sparse_set::tests::test_sparse_set_remove --locked
          cargo +nightly-2026-08-04 miri test -p katla_ecs --test entity_lifecycle --locked
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
          RAYON_NUM_THREADS: "2"
