name: Agent render graph diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Apply diagnostics fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          diagnostics_path = Path("katla_gfx/src/render_graph/diagnostics.rs")
          source = diagnostics_path.read_text()
          source = source.replace(
              "        let resources = resources\n            .iter()",
              "        let diagnostic_resources = resources\n            .iter()",
              1,
          )
          source = source.replace(
              "            resources: resources.len(),",
              "            resources: diagnostic_resources.len(),",
              1,
          )
          source = source.replace(
              "            resources,\n            passes: diagnostic_passes,",
              "            resources: diagnostic_resources,\n            passes: diagnostic_passes,",
              1,
          )
          diagnostics_path.write_text(source)

          compiler_path = Path("katla_gfx/src/render_graph/compiler.rs")
          source = compiler_path.read_text()
          source = source.replace(
              "#[derive(Debug, Clone)]\n#[expect(dead_code)]\npub(crate) struct PassDagNode",
              "#[derive(Debug, Clone)]\npub(crate) struct PassDagNode",
              1,
          )
          compiler_path.write_text(source)

          shader_path = Path("katla_gfx/src/vulkan/material/shadermodule.rs")
          source = shader_path.read_text()
          source = source.replace(
              "        match dir.parent() {\n"
              "            Some(parent) => dir = parent,\n"
              "            None => return None,\n"
              "        }",
              "        dir = dir.parent()?;",
              1,
          )
          shader_path.write_text(source)
          PY

      - name: Format source
        run: cargo fmt --all

      - name: Test render graph diagnostics
        shell: bash
        run: |
          set -o pipefail
          cargo test -p katla_gfx render_graph::diagnostics --lib \
            2>&1 | tee /tmp/render-graph-diagnostics-test.log

      - name: Export test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-graph-diagnostics-test
          path: |
            /tmp/render-graph-diagnostics-test.log
            katla_gfx/src/render_graph/diagnostics.rs
            katla_gfx/src/render_graph/mod.rs
          retention-days: 1

      - name: Test graphics library
        run: cargo test -p katla_gfx --lib

      - name: Check graphics library
        run: cargo check -p katla_gfx --lib

      - name: Lint graphics library
        shell: bash
        run: |
          set -o pipefail
          cargo clippy -p katla_gfx --lib -- -D warnings \
            2>&1 | tee /tmp/render-graph-diagnostics-clippy.log

      - name: Export Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-graph-diagnostics-clippy
          path: /tmp/render-graph-diagnostics-clippy.log
          retention-days: 1

      - name: Commit validated diagnostics
        shell: bash
        run: |
          git add \
            katla_gfx/src/render_graph/diagnostics.rs \
            katla_gfx/src/render_graph/mod.rs \
            katla_gfx/src/render_graph/compiler.rs \
            katla_gfx/src/vulkan/material/shadermodule.rs
          if git diff --cached --quiet; then
            echo "Source is already validated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add deterministic render graph diagnostics"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
