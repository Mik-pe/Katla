name: Agent editor viewport runtime validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  render:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Render a headless editor screenshot
        shell: bash
        env:
          RUST_LOG: info
        run: |
          set -o pipefail
          cargo run -- --headless -s --screenshot /tmp/katla-editor.png \
            2>&1 | tee /tmp/katla-editor.log

      - name: Verify screenshot
        run: |
          test -s /tmp/katla-editor.png
          file /tmp/katla-editor.png

      - name: Upload runtime validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katla-editor-runtime-validation
          path: |
            /tmp/katla-editor.png
            /tmp/katla-editor.log
          retention-days: 1
