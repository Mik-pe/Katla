name: Agent editor viewport and selection

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-14
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Apply candidate fixes
        run: python3 .github/scripts/apply_editor_viewport_selection_fix.py

      - name: Format source
        run: cargo fmt --all

      - name: Test tonemap target coordinates
        run: cargo test -p katla_gfx metal::frame_render::tests --lib -- --test-threads=1

      - name: Test Metal object-buffer validation
        run: cargo test -p katla_gfx object_buffer_capacity_tests --lib -- --test-threads=1

      - name: Check graphics and application crates
        run: cargo check -p katla_gfx -p katla_app

      - name: Lint graphics and application crates
        run: cargo clippy -p katla_gfx -p katla_app -- -D warnings

      - name: Commit validated production fixes
        shell: bash
        run: |
          git add \
            katla_app/src/application/renderer.rs \
            katla_gfx/src/metal/frame_render.rs \
            katla_gfx/src/metal/metal_renderer.rs
          if git diff --cached --quiet; then
            echo "Validated source is already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix editor viewport composition and hierarchy selection crash"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
