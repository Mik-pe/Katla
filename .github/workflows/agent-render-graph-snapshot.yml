name: Agent render graph validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-14
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Format source
        run: cargo fmt --all

      - name: Commit formatting
        shell: bash
        run: |
          if ! git diff --quiet -- katla_gfx/src/render_graph/compiler.rs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add katla_gfx/src/render_graph/compiler.rs
            git commit -m "Format render graph compiler"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Test render graph compiler
        run: cargo test -p katla_gfx render_graph::compiler --lib

      - name: Test graphics crate
        shell: bash
        run: |
          set +e
          cargo test -p katla_gfx --all-targets 2>&1 | tee /tmp/graphics-test.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload graphics test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphics-test-log
          path: /tmp/graphics-test.log
          retention-days: 1

      - name: Lint graphics crate
        run: cargo clippy -p katla_gfx --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-features --all-targets

      - name: Lint workspace
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Test documentation
        run: cargo test --workspace --doc
