name: Agent render graph validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Format source
        run: cargo fmt --all

      - name: Upload formatted compiler
        uses: actions/upload-artifact@v4
        with:
          name: formatted-render-graph-compiler
          path: katla_gfx/src/render_graph/compiler.rs
          retention-days: 1

      - name: Test render graph compiler
        run: cargo test -p katla_gfx render_graph::compiler --lib

      - name: Test graphics crate
        run: cargo test -p katla_gfx --all-targets

      - name: Lint graphics crate
        run: cargo clippy -p katla_gfx --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-features --all-targets

      - name: Lint workspace
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Test documentation
        run: cargo test --workspace --doc
