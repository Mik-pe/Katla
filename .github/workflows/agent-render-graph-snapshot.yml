name: Agent render graph snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pack source snapshot
        run: tar --exclude=.git -czf /tmp/katla-source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: katla-source
          path: /tmp/katla-source.tar.gz
          retention-days: 1
