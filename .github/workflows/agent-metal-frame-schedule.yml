                  "    /// Compositing — multi-viewport compositing.\n    Compositing,\n    /// UI overlay — composites UI commands over the rendered frame.\n    Ui,\n",
                  1,
              )
              pass_path.write_text(source)

          ui_path = Path("katla_gfx/src/render_graph/passes/ui.rs")
          source = ui_path.read_text()
          source = source.replace(
              "use crate::render_graph::pass::PassType;",
              "use crate::render_graph::pass::{PassKind, PassType};",
