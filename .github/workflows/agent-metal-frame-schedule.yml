name: Agent Metal frame schedule

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-14
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Restore and apply the reviewed Metal schedule patch
        shell: bash
        run: |
          git show c9ebebca9ee903284eecfb4e7ad8ae9154763fa3:.github/workflows/agent-metal-frame-schedule.yml \
            | sed -n "/python3 <<'PY'/,/^          PY$/p" \
            | sed '1d;$d;s/^          //' \
            > /tmp/apply_metal_frame_schedule.py
          test -s /tmp/apply_metal_frame_schedule.py
          python3 /tmp/apply_metal_frame_schedule.py

          python3 <<'PY'
          from pathlib import Path

          path = Path("katla_gfx/src/render_graph/frame/mod.rs")
          source = path.read_text()
          ui_arm = """                    Some(super::pass::PassKind::Ui) => {
                        self.execute_graphics_pass(&cmd, pass, data)?;
                    }
"""
          marker = "                    Some(super::pass::PassKind::Fullscreen) => {\n"
          if ui_arm not in source:
              if marker not in source:
                  raise SystemExit("Vulkan fullscreen pass dispatch marker not found")
              source = source.replace(marker, ui_arm + marker, 1)
              path.write_text(source)
          PY

      - name: Format candidate source
        run: cargo fmt --all

      - name: Test Metal frame schedule
        run: cargo test -p katla_gfx metal::frame_schedule --lib -- --test-threads=1

      - name: Check graphics and application crates
        run: cargo check -p katla_gfx -p katla_app

      - name: Lint graphics and application crates
        run: cargo clippy -p katla_gfx -p katla_app -- -D warnings

      - name: Commit validated Metal integration
        shell: bash
        run: |
          git add \
            katla_gfx/src/render_graph/pass.rs \
            katla_gfx/src/render_graph/passes/ui.rs \
            katla_gfx/src/render_graph/frame/mod.rs \
            katla_gfx/src/metal/mod.rs \
            katla_gfx/src/metal/frame_schedule.rs \
            katla_gfx/src/metal/metal_renderer.rs \
            katla_gfx/src/metal/frame_render.rs \
            katla_app/src/application/builder.rs
          if git diff --cached --quiet; then
            echo "Validated Metal integration is already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Drive Metal rendering from the compiled frame graph"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
