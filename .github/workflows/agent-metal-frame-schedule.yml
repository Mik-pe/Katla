name: Agent Metal frame schedule

on:
  pull_request:
    branches:
      - agent/render-graph-compiler

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Apply candidate Metal frame schedule patch
