              graph = graph.replace(
                  "use super::error::RenderGraphError;",
                  "use super::error::{GraphValidationError, RenderGraphError};",
                  1,
              )
              graph = graph.replace(
                  "    resources: HashMap<String, GraphResourceHandle>,",
                  "    resources: Vec<(String, GraphResourceHandle)>,",
                  1,
