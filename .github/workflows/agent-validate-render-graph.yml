name: Agent validate render graph

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-14
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Apply candidate validation patch
        run: python3 .github/scripts/apply_render_graph_validation.py

      - name: Format candidate source
        run: cargo fmt --all

      - name: Test render graph validation
        run: cargo test -p katla_gfx render_graph::frame_graph --lib -- --test-threads=1

      - name: Check graphics library
        run: cargo check -p katla_gfx --lib

      - name: Lint graphics library
        run: cargo clippy -p katla_gfx --lib -- -D warnings

      - name: Commit validated render graph source
        shell: bash
        run: |
          git add \
            katla_gfx/src/render_graph/error.rs \
            katla_gfx/src/render_graph/frame_graph.rs \
            katla_gfx/src/render_graph/mod.rs
          if git diff --cached --quiet; then
            echo "Validated source is already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Validate render graph structure before compilation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
