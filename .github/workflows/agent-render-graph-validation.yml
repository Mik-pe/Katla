name: Agent render graph validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Format source in the validation workspace
        run: cargo fmt --all

      - name: Export formatted compiler source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatted-render-graph-compiler
          path: katla_gfx/src/render_graph/compiler.rs
          retention-days: 1

      - name: Test render graph compiler
        run: cargo test -p katla_gfx render_graph::compiler --lib

      - name: Test graphics library
        run: cargo test -p katla_gfx --lib

      - name: Lint graphics library
        run: cargo clippy -p katla_gfx --lib -- -D warnings
