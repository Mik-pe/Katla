name: Agent render graph validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Check touched source formatting
        shell: bash
        run: |
          cargo fmt --all
          git diff --name-only > format-changes.txt
          git diff --exit-code -- \
            katla_gfx/src/render_graph/compiler.rs \
            katla_gfx/src/render_graph/execution_plan_diagnostics.rs \
            katla_gfx/src/render_graph/mod.rs

      - name: Test render graph compiler
        run: cargo test -p katla_gfx render_graph::compiler --lib

      - name: Test graphics library serially
        shell: bash
        run: |
          set +e
          cargo test -p katla_gfx --lib -- --test-threads=1 2>&1 | tee gfx-test.log
          status=${PIPESTATUS[0]}
          echo "$status" > gfx-test-status.txt
          exit "$status"

      - name: Export validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-graph-validation-diagnostics
          path: |
            format-changes.txt
            gfx-test.log
            gfx-test-status.txt
          retention-days: 1

      - name: Lint graphics library
        if: always()
        shell: bash
        run: |
          set +e
          cargo clippy -p katla_gfx --lib -- -D warnings 2>&1 | tee gfx-clippy.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Export clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-graph-clippy-diagnostics
          path: gfx-clippy.log
          retention-days: 1
