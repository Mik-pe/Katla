[package]
name = "katla-ecs-compile-workload"
version = "0.1.0"
edition = "2024"

[workspace]

[features]
editor = ["katla_ecs/editor", "dep:serde_json"]

[dependencies]
katla_ecs = { path = "../../../katla_ecs" }
serde_json = { version = "1.0", optional = true }

[profile.dev]
opt-level = 1
debug = 1
codegen-units = 256

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
