# UI Overlay Material
#
# Material for rendering immediate mode UI elements.
# Uses alpha blending and no depth testing.

name = "UIOverlay"

[shaders]
vertex = "../shaders/ui/ui.wgsl"
fragment = "../shaders/ui/ui.wgsl"

[bindings.uniforms.screen_size]
type = "vec2"
name = "screen_size"

[bindings.textures.font_atlas]
binding = 1
name = "font_atlas"

[bindings.textures.sampler]
binding = 2
name = "font_sampler"

[parameters]

[render_state]
depth_test = false
depth_write = false
cull_backfaces = false
alpha_blending = true
