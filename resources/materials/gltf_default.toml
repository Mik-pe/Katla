# GLTF Default Material (Bindless)
#
# Default material for GLTF models using bindless textures.
# Simple albedo-only rendering with bindless texture array.

name = "gltf_default"

[shaders]
vertex = "../shaders/model_simple.wgsl"
fragment = "../shaders/model_simple.wgsl"

# Bindless materials don't have per-material texture bindings
# Textures are accessed via ObjectUniforms.texture_indices
[bindings]

[render_state]
depth_test = true
depth_write = true
cull_backfaces = true
alpha_blending = false
