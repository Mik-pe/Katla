# Checkerboard Material
#
# A material with a procedurally generated checkerboard texture.
# Uses storage buffers with instance indexing for modern rendering.

name = "Checkerboard"

[shaders]
vertex = "../shaders/colored_mesh_storage.wgsl"
fragment = "../shaders/colored_mesh_storage.wgsl"

[bindings.uniforms.transform]
type = "mat4"
count = 3
name = "transform"

[bindings.uniforms.color]
type = "vec4"
name = "color"

[bindings.textures.albedo]
binding = 1
name = "albedo_texture"

[bindings.textures.sampler]
binding = 2
name = "albedo_sampler"

[parameters]
color = [1.0, 1.0, 1.0, 1.0]  # White - will blend with texture

[render_state]
depth_test = true
depth_write = true
cull_backfaces = true
alpha_blending = false
