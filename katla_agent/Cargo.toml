[package]
name = "katla_agent"
version = "0.1.0"
edition = "2024"

[features]
default = []
editor = []
llm-assistant = ["dep:async-openai", "dep:tokio", "dep:dirs", "dep:toml", "dep:futures"]
mcp-server = ["dep:rmcp", "dep:tokio", "dep:schemars", "dep:async-trait"]

[dependencies]
katla_ecs = { workspace = true, features = ["editor"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

# Optional LLM dependencies
async-openai = { version = "0.27", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util"], optional = true }
dirs = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }

# Optional MCP server dependencies
rmcp = { version = "1.3", optional = true, features = ["server", "transport-io", "macros"] }
schemars = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
katla_ecs = { workspace = true, features = ["editor"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
