[workspace]
members = ["katla_math", "katla_vulkan", "katla_app", "katla_ecs", "katla_derive", "katla_ui", "game"]
resolver = "2"

# Faster dev builds with some optimizations
[profile.dev]
opt-level = 1               # Basic optimizations
debug = true                # Keep debug symbols
debug-assertions = true     # Keep debug assertions
overflow-checks = true      # Keep overflow checks
lto = false                 # No LTO for faster builds
codegen-units = 256         # More parallelism for faster compilation

# Optimize heavy dependencies even in dev mode
[profile.dev.package."*"]
opt-level = 2               # Higher optimization for dependencies

# Release profile with full optimizations
[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = "thin"
codegen-units = 1           # Better optimizations, slower build
