[workspace]
members = ["katla_math", "katla_gfx", "katla_app", "katla_ecs", "katla_derive", "katla_ui", "game"]
default-members = ["game"]
resolver = "2"

[workspace.dependencies]
skrifa = "0.40"
vello_cpu = "0.0.7"
approx = "0.5"
ash = "0.38"
ash-window = "0.13"
bitflags = "2.11"
bytemuck = { version = "1.25", features = ["derive"] }
byteorder = "1.5"
clap = { version = "4.6", features = ["derive"] }
dirs = "6.0"
env_logger = "0.11"
gltf = { version = "1.4", features = ["KHR_materials_pbrSpecularGlossiness"] }
gpu-allocator = "0.28"
image = "0.25"
itertools = "0.14"
libc = "0.2"
log = "0.4"
naga = { version = "29.0.1", features = ["wgsl-in", "spv-out"] }
paste = "1.0"
png = "0.18"
proc-macro2 = "1.0"
quote = "1.0"
ron = "0.12"
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full"] }
toml = "1.0"
winit = "0.30"

# Internal workspace crates
katla_derive = { path = "katla_derive" }
katla_ecs = { path = "katla_ecs" }
katla_math = { path = "katla_math" }
katla_gfx = { path = "katla_gfx" }
katla_ui = { path = "katla_ui" }
katla_app = { path = "katla_app" }

# Faster dev builds with some optimizations
[profile.dev]
opt-level = 1               # Basic optimizations
debug = 1                   # Line tables only (faster builds)
debug-assertions = true     # Keep debug assertions
overflow-checks = true      # Keep overflow checks

# Optimize heavy dependencies even in dev mode
[profile.dev.package."*"]
opt-level = 2               # Higher optimization for dependencies

# Release profile with full optimizations
[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = "thin"
codegen-units = 1           # Better optimizations, slower build
