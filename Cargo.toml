[workspace]
members = ["katla_math", "katla_gfx", "katla_app", "katla_ecs", "katla_derive", "katla_ui", "katla_script", "katla_audio", "katla_icons", "katla_agent", "katla_physics", "game"]
default-members = ["game"]
resolver = "2"

[workspace.dependencies]
skrifa = "0.40"
vello_cpu = "0.0.7"
approx = "0.5"
ash = "0.38"
ash-window = "0.13"
# NOTE: block v0.1.6 future-incompat (uninhabited static) comes transitively via
# ash-window → raw-window-metal 0.4 → cocoa 0.25 → block. Cannot be fixed until
# ash-window upgrades to raw-window-metal ≥ 1.1 (which drops cocoa/block entirely).
# Track: https://github.com/SSheldon/rust-block/issues — no upstream release since 2020.
# Impact: will become a hard error in a future Rust edition. Safe to ignore for now.
bitflags = "2.11"
bytemuck = { version = "1.25", features = ["derive"] }
byteorder = "1.5"
clap = { version = "4.6", features = ["derive"] }
dirs = "6.0"
arboard = "3.4"
env_logger = "0.11"
gltf = { version = "1.4", features = ["KHR_materials_pbrSpecularGlossiness"] }
gpu-allocator = "0.28"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff"] }
itertools = "0.14"
libc = "0.2"
log = "0.4"
naga = { version = "29.0.1", features = ["wgsl-in", "spv-out", "msl-out"] }
notify = "8"
rayon = "1.10"
rapier3d = "0.32"
paste = "1.0"
png = "0.18"
proc-macro2 = "1.0"
quote = "1.0"
ron = "0.12"
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full"] }
toml = "1.0"
winit = "0.30"

# Internal workspace crates
katla_derive = { path = "katla_derive" }
katla_ecs = { path = "katla_ecs" }
katla_math = { path = "katla_math" }
katla_gfx = { path = "katla_gfx" }
katla_ui = { path = "katla_ui" }
katla_script = { path = "katla_script" }
katla_audio = { path = "katla_audio" }
katla_app = { path = "katla_app" }
katla_icons = { path = "katla_icons" }
katla_agent = { path = "katla_agent" }
katla_physics = { path = "katla_physics" }

# Faster dev builds with minimal optimizations
[profile.dev]
opt-level = 1               # Basic optimizations for own crates
debug = 1                   # Line tables only (faster builds)
debug-assertions = true     # Keep debug assertions
overflow-checks = true      # Keep overflow checks
codegen-units = 256         # Max parallelism for faster builds

# Dependencies: opt-level=1 for fast compile + decent runtime.
# Only specific hot-path crates get opt-level=2 below.
[profile.dev.package."*"]
opt-level = 1

# Selectively optimize performance-critical crates in dev mode
[profile.dev.package.rapier3d]
opt-level = 2
[profile.dev.package.naga]
opt-level = 2

# Release profile with full optimizations
[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = "thin"
codegen-units = 1           # Better optimizations, slower build
