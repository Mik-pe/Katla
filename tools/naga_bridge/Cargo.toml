[package]
name = "katla-naga-compiler"
version = "0.1.0"
edition = "2024"
publish = false

# Naga remains an external compiler dependency; this helper imports no engine crate.
[workspace]

[lib]
crate-type = ["rlib"]

[[bin]]
name = "katla-shader-compiler"
path = "src/main.rs"

[dependencies]
naga = { version = "=29.0.1", features = ["wgsl-in", "spv-out", "msl-out"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
