[package]
name = "katla-odin-scene-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rapier3d = "=0.32.0"
mlua = { version = "=0.11.6", features = ["luau", "vendored", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
