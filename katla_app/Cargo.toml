[package]
name = "katla_app"
version = "0.1.0"
authors = ["Mik-pe <mikael.pettersson201@gmail.com>"]
edition = "2024"

[features]
# macOS defaults to Metal, all other platforms default to Vulkan.
# Override with --features vulkan or --features metal as needed.
# Both can be enabled simultaneously for runtime backend selection.
default = ["editor", "metal"]
editor = ["katla_ecs/editor", "katla_script/editor"]
mcp = ["katla_agent/mcp-server"]
vulkan = ["katla_gfx/vulkan"]
metal = ["katla_gfx/metal"]

[dependencies]
katla_math = { workspace = true }
katla_gfx = { workspace = true }
katla_ecs = { workspace = true }
katla_ui = { workspace = true }
katla_icons = { workspace = true }
katla_derive = { workspace = true }
katla_script = { workspace = true }
katla_agent = { workspace = true, features = ["llm-assistant"] }
ash = { workspace = true }
bytemuck = { workspace = true }
byteorder = { workspace = true }
winit = { workspace = true }
image = { workspace = true }
env_logger = { workspace = true }
gltf = { workspace = true }
itertools = { workspace = true }
approx = { workspace = true }
log = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
arboard = { workspace = true }
png = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
skrifa = { workspace = true }
toml = { workspace = true }
rayon = { workspace = true }
vello_cpu = { workspace = true }
