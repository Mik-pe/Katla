[package]
name = "game"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "katla"
path = "src/main.rs"

[dependencies]
katla_app = { path = "../katla_app" }
katla_ecs = { path = "../katla_ecs" }
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
rand = "0.8"

[[bin]]
name = "performance_benchmark"
path = "benches/performance_benchmark.rs"
