[package]
name = "game"
version = "0.1.0"
edition = "2024"
default-run = "katla"

[features]
default = []
mcp = ["katla_app/mcp"]

[[bin]]
name = "katla"
path = "src/main.rs"

[dev-dependencies]
rand = { workspace = true }

[dependencies]
katla_app = { workspace = true }
katla_ecs = { workspace = true }
katla_script = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
image = { workspace = true }
winit = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[[bin]]
name = "katla-mcp"
path = "src/mcp_proxy.rs"
