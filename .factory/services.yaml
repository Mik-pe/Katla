commands:
  install: cargo build --workspace
  typecheck: cargo check --workspace
  build: cargo build --workspace
  test: cargo test --workspace
  lint: cargo clippy --workspace
  format: cargo fmt
  format_check: cargo fmt -- --check
  headless_validation: cargo run -- -s
  test_katla_ecs: cargo test -p katla_ecs
  test_katla_gfx: cargo test -p katla_gfx
  test_katla_ui: cargo test -p katla_ui
  test_katla_app: cargo test -p katla_app
  check_no_editor: cargo check -p katla_app --no-default-features
  check_with_editor: cargo check -p katla_app --features editor
  check_release: cargo check -p katla_app --release
  picking_validation: cargo run -p katla_gfx --example picking_validation --features validation
  outline_validation: cargo run -p katla_gfx --example outline_validation --features validation

services: {}
